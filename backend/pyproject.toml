[project]
name = "payent-backend"
version = "1.0.0"
description = "Payent FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "email-validator>=2.1.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "razorpay>=1.4.1",
]

[tool.hatch.build.targets.wheel]
only-include = ["*.py", "README.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
