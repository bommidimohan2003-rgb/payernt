<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Payent — Rent premium tech gear</title>
  <!-- Preconnect & DNS-Prefetch for CDN assets, fonts, and payment gateways -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />
  <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
  <script>
    try {
      var stored = localStorage.getItem('payent:theme');
      var theme = stored ? (stored.startsWith('"') ? JSON.parse(stored) : stored) : 'system';
      if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {
      if (stored === 'dark') document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
